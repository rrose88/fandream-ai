
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>Fandream AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090d;
      color: #fff;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 480px; }
    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .logo span { color: #b18aff; }
    p { color: #aaa5b5; line-height: 1.7; }
    button {
      background: #b18aff;
      color: #130d1d;
      border: 0;
      padding: 15px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }
    .tag {
      color: #c7a9ff;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">Your imagination, your world</div>
    <div class="logo">Fan<span>dream</span> AI</div>
    <p>
      Create your own AI characters, shape their
      personalities and discover conversations
      limited only by your imagination.
    </p>
    <button onclick="alert('Character creation is coming soon!')">
      Create your character
    </button>
    <p>18+ Adults Only</p>
  </main>
</body>
</html>
