<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0910">
<title>Fandream AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0910;color:white;font-family:Arial,sans-serif}
header{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #302638}
.logo{font-size:25px;font-weight:800}.logo span{color:#b68aff}
main{max-width:700px;margin:35px auto;padding:20px}
.card{background:#17131e;border:1px solid #302638;border-radius:18px;padding:24px;margin:16px 0}
input,textarea{width:100%;padding:13px;margin:7px 0 16px;background:#100d16;border:1px solid #493b56;border-radius:9px;color:white}
label{font-size:13px;color:#c9bdce}
button{padding:13px 18px;border:0;border-radius:10px;background:#b68aff;color:#170f20;font-weight:bold;cursor:pointer}
.secondary{background:#302638;color:white}
button:disabled{opacity:.5;cursor:wait}
h1{font-size:30px}p{color:#aaa2b4;line-height:1.6}
.hidden{display:none!important}
.notice{padding:12px;border-radius:9px;background:#292036;color:#d6c1ff;margin:12px 0}
.character{padding:15px;background:#211a2b;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<header>
 <div class="logo">Fan<span>dream</span> AI</div>
 <button id="logout" class="secondary hidden" onclick="signOut()">Log out</button>
</header>

<main>
 <section id="auth">
  <div class="card">
   <h1>Welcome to Fandream AI</h1>
   <p>Create your account and start building your own AI characters.</p>

   <label>Email address</label>
   <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

   <label>Password</label>
   <input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password">

   <button id="signupButton" onclick="signUp()">Create account</button>
   <button id="loginButton" class="secondary" onclick="signIn()">Log in</button>
   <p><a href="#" onclick="resetPassword();return false" style="color:#b68aff">Forgot password?</a></p>
   <div id="authMessage" class="notice hidden" role="status"></div>
  </div>
 </section>

 <section id="app" class="hidden">
  <h1>Your creative space ✨</h1>
  <p id="welcome"></p>
  <div class="card">
   <h2>Create a character</h2>
   <label>Character name</label>
   <input id="characterName" placeholder="Character name">
   <label>Description</label>
   <textarea id="description" placeholder="Describe your fictional character"></textarea>
   <label>Personality</label>
   <input id="personality" placeholder="Friendly, funny, creative">
   <button onclick="saveCharacter()">Save character</button>
   <div id="saveMessage" class="notice hidden" role="status"></div>
  </div>

  <h2>Your characters</h2>
  <div id="characters"><p>Loading characters...</p></div>
 </section>
</main>

<script>
const SUPABASE_URL = "https://sqvbkwjjbxnxelrcxwmq.supabase.co";
const SUPABASE_KEY = "sb_publishable_tHSA5_iIXFLHytnZFpJvYg_Q-AQmx5c";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

function message(id,text){
 const el=document.getElementById(id);
 el.textContent=text;
 el.classList.remove('hidden');
}

function credentials(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email || !password){
  message('authMessage','Please enter your email and password.');
  return null;
 }
 if(password.length<8){
  message('authMessage','Your password must be at least 8 characters.');
  return null;
 }
 return {email,password};
}

async function signUp(){
 const data=credentials();
 if(!data)return;
 const button=document.getElementById('signupButton');
 button.disabled=true;
 try{
  const {data:result,error}=await client.auth.signUp(data);
  if(error)throw error;
  if(result.session){
   message('authMessage','Account created successfully!');
  }else{
   message('authMessage','Account created! Please check your email and confirm your account before logging in.');
  }
 }catch(e){
  message('authMessage',e.message);
 }finally{button.disabled=false;}
}

async function signIn(){
 const data=credentials();
 if(!data)return;
 try{
  const {error}=await client.auth.signInWithPassword(data);
  if(error)throw error;
 }catch(e){
  message('authMessage',e.message);
 }
}

async function resetPassword(){
 const email=document.getElementById('email').value.trim();
 if(!email){
  message('authMessage','Enter your email address first.');
  return;
 }
 try{
  const {error}=await client.auth.resetPasswordForEmail(email,{
   redirectTo:location.origin
  });
  if(error)throw error;
  message('authMessage','Password reset instructions have been sent if the account exists.');
 }catch(e){
  message('authMessage',e.message);
 }
}

async function signOut(){
 await client.auth.signOut();
}

async function updateSession(user){
 currentUser=user;
 document.getElementById('auth').classList.toggle('hidden',!!user);
 document.getElementById('app').classList.toggle('hidden',!user);
 document.getElementById('logout').classList.toggle('hidden',!user);
 if(user){
  document.getElementById('welcome').textContent='Signed in as '+user.email;
  await loadCharacters();
 }
}

client.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'){
  message('authMessage','Password recovery session opened. Password reset form can be added next.');
 }
 updateSession(session?.user||null);
});

client.auth.getSession().then(({data})=>{
 updateSession(data.session?.user||null);
});

async function saveCharacter(){
 if(!currentUser)return;
 const name=document.getElementById('characterName').value.trim();
 const description=document.getElementById('description').value.trim();
 const personality=document.getElementById('personality').value
  .split(',').map(x=>x.trim()).filter(Boolean);

 if(!name){
  message('saveMessage','Please enter a character name.');
  return;
 }
 const {error}=await client.from('characters').insert({
  user_id:currentUser.id,
  name,
  description,
  personality
 });
 if(error){
  message('saveMessage','Could not save character: '+error.message);
  return;
 }
 message('saveMessage','Character saved to your account!');
 document.getElementById('characterName').value='';
 document.getElementById('description').value='';
 document.getElementById('personality').value='';
 await loadCharacters();
}

async function loadCharacters(){
 const container=document.getElementById('characters');
 const {data,error}=await client.from('characters')
  .select('id,name,description,personality,created_at')
  .order('created_at',{ascending:false});

 if(error){
  container.textContent='Could not load characters: '+error.message;
  return;
 }
 container.replaceChildren();
 if(!data.length){
  container.textContent='No characters yet. Create your first one above!';
  return;
 }
 data.forEach(c=>{
  const card=document.createElement('div');
  card.className='character';
  const title=document.createElement('h3');
  title.textContent=c.name;
  const desc=document.createElement('p');
  desc.textContent=c.description||'No description added.';
  const traits=document.createElement('p');
  traits.textContent=(c.personality||[]).join(' · ');
  card.append(title,desc,traits);
  container.append(card);
 });
}
</script>
</body>
</html>
